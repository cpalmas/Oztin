<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#232840"/>
      <stop offset="100%" stop-color="#141720"/>
    </radialGradient>
    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4b942"/>
      <stop offset="100%" stop-color="#e07b00"/>
    </radialGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- Cuerpo del cuervo -->
  <ellipse cx="50" cy="62" rx="22" ry="20" fill="#1a1a2e"/>

  <!-- Cabeza del cuervo -->
  <ellipse cx="50" cy="36" rx="16" ry="15" fill="#1a1a2e"/>

  <!-- Pico superior -->
  <path d="M 50 40 L 60 44 L 50 48 Z" fill="#2a2040"/>
  <!-- Pico inferior -->
  <path d="M 50 48 L 60 44 L 55 50 Z" fill="#1a1535"/>

  <!-- Ojo izquierdo (brillo dorado) -->
  <circle cx="43" cy="33" r="5" fill="url(#eye-glow)"/>
  <circle cx="43" cy="33" r="3" fill="#1a0a00"/>
  <circle cx="44.5" cy="31.5" r="1.2" fill="rgba(255,255,255,0.7)"/>

  <!-- Ojo derecho -->
  <circle cx="54" cy="33" r="2" fill="url(#eye-glow)"/>
  <circle cx="54" cy="33" r="1.2" fill="#1a0a00"/>
  <circle cx="54.7" cy="32.3" r="0.5" fill="rgba(255,255,255,0.7)"/>

  <!-- Alas laterales -->
  <path d="M 28 58 Q 20 45 28 35 Q 32 50 35 58 Z" fill="#141428" opacity="0.9"/>
  <path d="M 72 58 Q 80 45 72 35 Q 68 50 65 58 Z" fill="#141428" opacity="0.9"/>

  <!-- Plumas de la cresta -->
  <path d="M 44 22 Q 42 15 44 10 Q 46 16 46 22 Z" fill="#1a1a2e"/>
  <path d="M 50 20 Q 49 12 51 8 Q 52 14 52 20 Z" fill="#1a1a2e"/>
  <path d="M 56 22 Q 55 15 58 11 Q 58 17 57 22 Z" fill="#1a1a2e"/>

  <!-- Destello azul-morado en el pecho (acento UVTV) -->
  <ellipse cx="50" cy="62" rx="10" ry="8" fill="#5c6ef8" opacity="0.25"/>

  <!-- Patas -->
  <line x1="44" y1="79" x2="40" y2="88" stroke="#2a2040" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="79" x2="60" y2="88" stroke="#2a2040" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="88" x2="36" y2="91" stroke="#2a2040" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="88" x2="40" y2="92" stroke="#2a2040" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="88" x2="44" y2="91" stroke="#2a2040" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="56" y2="91" stroke="#2a2040" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="60" y2="92" stroke="#2a2040" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="64" y2="91" stroke="#2a2040" stroke-width="2" stroke-linecap="round"/>
</svg>
