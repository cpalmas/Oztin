<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oztin — Asistente Escolar UVTV</title>
  <link rel="stylesheet" href="public/css/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ══════════════════════════════════
       SIDEBAR — Navegación & Links
  ══════════════════════════════════ -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="brand-logo">
        <img src="public/assets/oztin-avatar.svg" alt="Logo Oztin" class="brand-logo__img" />
        <div>
          <h1 class="brand-logo__name">Oztin</h1>
          <span class="brand-logo__sub">UVTV · Asistente Escolar</span>
        </div>
      </div>
    </div>

    <nav class="sidebar__nav">
      <p class="sidebar__nav-label">ACCESOS RÁPIDOS</p>
      <div id="quick-links" class="quick-links-grid"></div>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__help-card">
        <span class="help-card__emoji">📞</span>
        <div>
          <p class="help-card__title">¿Necesitas más ayuda?</p>
          <a href="mailto:servicios@uvtv.edu.mx" class="help-card__link">servicios@uvtv.edu.mx</a>
        </div>
      </div>
    </div>
  </aside>

  <!-- ══════════════════════════════════
       ÁREA PRINCIPAL DEL CHAT
  ══════════════════════════════════ -->
  <main class="chat-layout">

    <!-- Header del chat -->
    <header class="chat-header">
      <div class="chat-header__info">
        <div class="status-dot"></div>
        <span class="chat-header__name">Oztin el Cuervo</span>
        <span class="chat-header__status">En línea · Siempre disponible</span>
      </div>
      <div class="chat-header__actions">
        <button id="clear-btn" class="icon-btn" title="Nueva conversación">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 .49-3.51"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Área de mensajes -->
    <section class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-label="Conversación con Oztin">
    </section>

    <!-- Input de usuario -->
    <footer class="chat-input-area">
      <div class="input-wrapper">
        <textarea
          id="user-input"
          class="user-input"
          placeholder="Escribe tu pregunta aquí..."
          rows="1"
          aria-label="Escribe tu mensaje"
        ></textarea>
        <button id="send-btn" class="send-btn" aria-label="Enviar mensaje">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="input-hint">Presiona <kbd>Enter</kbd> para enviar · <kbd>Shift+Enter</kbd> para salto de línea</p>
    </footer>
  </main>

  <!-- Scripts MVC — orden importante -->
  <script src="models/AssistantModel.js"></script>
  <script src="views/AssistantView.js"></script>
  <script src="controllers/AssistantController.js"></script>
  <script src="public/js/app.js"></script>
</body>
</html>
